# ============================================
# Application Configuration
# ============================================
spring.application.name=ledger-wallet-service

# ============================================
# PostgreSQL DataSource
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=ledger_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HikariCP Connection Pool
# ============================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '2000ms'; SET statement_timeout = '10000ms'

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Flyway Migrations
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================
# Server
# ============================================
server.port=8080

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# Logging
# ============================================
app.cors.allowed-origins=http://localhost:3000

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

logging.level.com.eigen04.ledger=INFO
